plugins {
    id 'com.android.application'
}

def signingPropertiesFile = rootProject.file('keystore.properties')
def releaseSigning = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { releaseSigning.load(it) }
    ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].each { key ->
        if (!releaseSigning.getProperty(key)?.trim()) {
            throw new GradleException("Missing ${key} in keystore.properties")
        }
    }
}

android {
    namespace = "com.cinemax.nexus"
    compileSdk = 37

    defaultConfig {
        applicationId = "com.cinemax.nexus"
        minSdk = 24
        targetSdk = 36
        versionCode = 9
        versionName = "3.2.2"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
        testApplicationId = "com.cinemax.nexus.enhancementtest"
    }

    if (signingPropertiesFile.isFile()) {
        signingConfigs {
            release {
                storeFile = rootProject.file(releaseSigning.getProperty('storeFile'))
                storePassword = releaseSigning.getProperty('storePassword')
                keyAlias = releaseSigning.getProperty('keyAlias')
                keyPassword = releaseSigning.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // R8 strips unused code/resources: the debug APK carries ~8 MB of
            // unminified dex that mostly belongs to Material and Media3.
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingPropertiesFile.isFile()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    // Pinned publisher AARs are bundled for reproducible builds; see libs/README.txt.
    implementation files('libs/vosk-android-0.3.75.aar', 'libs/jna-5.18.1.aar')
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.fragment:fragment:1.8.0'
    implementation 'androidx.activity:activity:1.9.1'

    // Pin core to a compileSdk-34-compatible version so no transitive dep pulls 1.18.0 (needs SDK 36)
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.core:core-ktx:1.13.1'

    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-session:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.4.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.4.1'

    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}


